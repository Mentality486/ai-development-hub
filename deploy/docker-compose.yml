# AI Development Hub —— 本地数据存储（Docker Desktop）
# 注意：这里只跑 MySQL/Redis 数据存储，不跑任何 Agent / 构建 / 项目代码。
#       Agent 与构建 100% 在 WSL Ubuntu Native 执行（需求硬约束）。
# 端口绑定 127.0.0.1，不对外暴露；不碰 10.7.0.185。

services:
  mysql:
    image: mysql:8.0
    container_name: aihub-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max_connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 设置}
      MYSQL_DATABASE: ai_hub
      MYSQL_USER: ai_hub
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/.env 设置}
      TZ: Asia/Shanghai
    ports:
      # 宿主 3306 预留给可能的其他实例；Hub 用 13306，避免冲突
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: aihub-redis
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --bind 0.0.0.0 \
          --port 6379 \
          --requirepass "$$REDIS_PASSWORD" \
          --appendonly yes \
          --maxmemory 1gb \
          --maxmemory-policy allkeys-lru \
          --rename-command FLUSHALL "" \
          --rename-command FLUSHDB ""
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 deploy/.env 设置}
      TZ: Asia/Shanghai
    ports:
      # Windows 宿主已有 redis-server 占用 6379；Hub 用 16379
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql-data:
    name: aihub-mysql-data
  redis-data:
    name: aihub-redis-data
