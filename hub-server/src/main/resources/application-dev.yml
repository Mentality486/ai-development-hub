spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13306/ai_hub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:ai_hub}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
  flyway:
    enabled: true
    locations: classpath:database/flyway
    baseline-on-migrate: true
    validate-on-migrate: true

hub:
  security:
    jwt:
      secret: ${JWT_SECRET:ai-hub-dev-secret-change-me-in-production-please-32bytes}
      expiration-ms: 28800000
